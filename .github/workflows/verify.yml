name: Verify OCR fusion logic
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Build complete portable Skill
        run: |
          mkdir -p dist/scan-book-to-digital-pdf
          cp SKILL.md README.md LICENSE requirements.txt dist/scan-book-to-digital-pdf/
          cp -R scripts references agents tests dist/scan-book-to-digital-pdf/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          cd dist && zip -qr ../skill.zip scan-book-to-digital-pdf
          unzip -t ../skill.zip
      - uses: actions/upload-artifact@v4
        with:
          name: complete-skill
          path: skill.zip
          if-no-files-found: error
